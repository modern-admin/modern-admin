# Publishes already-versioned @modern-admin/* packages from main.
#
# Version preparation deliberately lives in prepare-release.yml on develop.
# By the time a develop -> main promotion PR is merged, changesets have been
# consumed and package.json/CHANGELOG/bun.lock already describe the release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Publishing is irreversible. Queue runs so a retry cannot race a newer push.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'modern-admin/modern-admin'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main is publish-only. Pending changesets mean the preparation PR was
      # bypassed, so fail before npm credentials are exposed to any step.
      - name: Assert release is versioned
        shell: bash
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            [[ "$file" == '.changeset/README.md' ]] || pending+=("$file")
          done
          if (( ${#pending[@]} > 0 )); then
            echo '::error::Pending changesets reached main. Prepare versions on develop first.'
            printf '  %s\n' "${pending[@]}"
            exit 1
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Avoid opening the protected npm environment for repo-only promotions
      # or workflow retries after every version is already present on npm.
      - name: Select release mode
        id: release-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

      # The generated Prisma client is gitignored; typecheck needs it. Prisma
      # resolves DATABASE_URL while loading its config but generate never
      # connects, so an inert URL is sufficient.
      - name: Generate Prisma client
        run: bun run --filter @modern-admin/app-api-prisma prisma:generate
        env:
          DATABASE_URL: postgresql://localhost/ci

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build all publishable packages
        run: bun run --filter './packages/*' build

  publish:
    name: Publish packages
    needs: verify
    if: needs.verify.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # Approval happens only after the read-only verification job is green.
    # Restrict this environment to main and require a release owner in
    # Settings -> Environments -> npm-production.
    environment: npm-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keep npm credentials scoped to the two steps that need them. The
      # project-local file disappears with the ephemeral runner.
      - name: Configure registry auth
        run: |
          printf '%s\n' \
            '@modern-admin:registry=https://registry.npmjs.org' \
            "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
            'always-auth=true' > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        run: bun run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
