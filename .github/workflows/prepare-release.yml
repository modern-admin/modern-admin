# Maintains a draft version PR against develop. Merging that PR is the
# explicit release-cut action: it consumes changesets, bumps package versions,
# updates changelogs, and synchronizes bun.lock without publishing anything.

name: Prepare release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: prepare-release-develop
  cancel-in-progress: false

jobs:
  version:
    name: Update version PR
    if: >-
      github.ref == 'refs/heads/develop' &&
      github.repository == 'modern-admin/modern-admin'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bun run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: develop
          pr-draft: create

      - name: Run CI for version PR
        if: steps.changesets.outputs.has-changesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/develop
        env:
          GH_TOKEN: ${{ github.token }}
