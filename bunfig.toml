# bun configuration — https://bun.sh/docs/runtime/bunfig
[install]
# strict workspace resolution; let bun manage the lockfile
exact = false
auto = "auto"

[install.scopes]
# placeholder for private registries when needed

[test]
# `apps/e2e/tests/*.spec.ts` are Playwright specs — they match bun's test glob
# but blow up under bun's runner ("Playwright Test did not expect
# test.describe() to be called here"). Run them with `bun run e2e`.
pathIgnorePatterns = ["**/apps/e2e/**"]
